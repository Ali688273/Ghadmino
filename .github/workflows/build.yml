name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download compatible Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Restore release keystore
        env:
          GHADMINO_KEYSTORE_BASE64: ${{ secrets.GHADMINO_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GHADMINO_KEYSTORE_BASE64" | base64 --decode > ghadmino-release.jks
          chmod 600 ghadmino-release.jks

      - name: Build signed release APK
        env:
          GHADMINO_KEYSTORE_PASSWORD: ${{ secrets.GHADMINO_KEYSTORE_PASSWORD }}
          GHADMINO_KEY_PASSWORD: ${{ secrets.GHADMINO_KEY_PASSWORD }}
          GHADMINO_KEY_ALIAS: ${{ secrets.GHADMINO_KEY_ALIAS }}
        run: /tmp/gradle-8.13/bin/gradle assembleRelease --no-daemon

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ghadmino-release-signed-apk
          path: app/build/outputs/apk/release/*.apk
